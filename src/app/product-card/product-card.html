<section class="product-card">
    <div class="card-top">
        <span class="product-icon">
            {{ product.category }}
        </span>

        <span class="status" [class.active]="product.status === 'Active'"
            [class.pending]="product.status === 'In Progress'">
            {{ product.status }}
        </span>
    </div>

    <h3>{{ product.name }}</h3>

    <p class="metric-label">{{ product.metricLabel }}</p>
    <p class="metric-value">{{ product.metricValue }}</p>

    <button class="details-button" type="button" (click)="onViewDetails()">
        View Details
    </button>
</section>
